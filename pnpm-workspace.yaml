packages:
  - 'packages/*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  typescript: npm:typescript-native-bridge@latest
overrides:
  typescript: 'catalog:'
  vite@*: 'catalog:'
allowBuilds:
  '@antv/util': false
  '@parcel/watcher': false
  core-js: false
  core-js-pure: false
  es5-ext: false
  esbuild: false
  simple-git-hooks: false
  typeit: false
  vue-demi: false
shamefullyHoist: true
ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - '@iconify/json@2.2.541'
  - '@types/node@26.6.5'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
